<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gents Socials</title>
  <meta name="description" content="Gents Socials — posts, forum discussions and member profiles.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239a6b1f'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E">
  <script>
    // Apply a saved theme before first paint to avoid a flash of the wrong colors
    try {
      var savedTheme = localStorage.getItem('gents-socials:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Mobile-only top bar -->
  <header class="topbar">
    <a class="brand" href="#/posts"><span class="brand-mark">G</span><span class="brand-text">Gents Socials</span></a>
    <div class="topbar-right">
      <span class="topbar-title" id="topbar-title">Posts</span>
      <button class="theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle dark mode"></button>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar on desktop, bottom tab bar on mobile -->
    <nav class="nav" aria-label="Main">
      <a class="brand nav-brand" href="#/posts"><span class="brand-mark">G</span><span class="brand-text">Gents Socials</span></a>
      <a class="nav-link" href="#/posts" data-tab="posts">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Posts</span>
      </a>
      <a class="nav-link" href="#/forum" data-tab="forum">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Forum</span>
      </a>
      <a class="nav-link" href="#/profile" data-tab="profile">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
      <button class="nav-link nav-theme" type="button" data-action="toggle-theme" aria-label="Toggle dark mode"></button>
      <div class="nav-me" id="nav-me"></div>
    </nav>

    <main class="view" id="view" tabindex="-1"></main>

    <aside class="aside" id="aside" aria-label="Highlights"></aside>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
